<page name="Settings" size="44x30" shows="over">
  <div id="e1" name="Card" x="0" y="0" w="100%" h="100%" style='background: $panel; border-radius: $radiusLarge; gap: $spaceLarge; layout: "down"; padding: 2'>
    <span id="e2" name="Title" x="0" y="0" w="hug" h="hug" style="font-size: $textLarge; font-weight: 700">"Line settings"</span>
    <div id="e3" name="Mode row" x="0" y="0" w="fill" h="4.4" style='align: "center left"; gap: $space; layout: "right"'>
      <span id="e4" name="Mode label" x="0" y="0" w="fill" h="hug" style="color: $dim">"Mode"</span>
      <Dropdown id="e5" name="Mode" x="0" y="0" w="20" h="4.4" options="Mode.options" value="Line.Settings.mode"/>
    </div>
    <div id="e6" name="Target row" x="0" y="0" w="fill" h="4.4" style='align: "center left"; gap: $space; layout: "right"'>
      <span id="e7" name="Target label" x="0" y="0" w="fill" h="hug" style="color: $dim">"Target parts"</span>
      <input id="e8" name="Target" x="0" y="0" w="20" h="4.4" value="Line.Settings.target" style="background: $panel2; border-radius: $radius; color: $text; padding: 1">
        <on event="change">
          notify("Target set to " + p.value);
        </on>
      </input>
    </div>
    <div id="e9" name="Spacer" x="0" y="0" w="fill" h="fill"/>
    <Button id="e10" name="Done" x="0" y="0" w="fill" h="5" fill="$accent" text='"Done"' textColour="$onFill" textSize="1.6">
      <on event="confirm">
        close(true);
      </on>
    </Button>
  </div>
</page>
