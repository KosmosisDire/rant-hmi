<object name="Line" mesh="Line1" note="The packing line: its belt, its label camera and its logic">
  <variable name="Speed" entity="Speed" intent="write"/>
  <variable name="Running" entity="Running" intent="write"/>
  <variable name="Settings" entity="Settings" intent="write"/>
  <topic name="Conveyor" entity="Conveyor"/>
  <topic name="Jog" entity="Jog" intent="write"/>
  <function name="Reset" entity="Reset"/>
  <topic name="LabelCam" entity="LabelCam"/>
  <topic name="Labels" entity="LabelCam/Detections"/>
  <var name="runSeconds" start="0" per="hmi"/>
  <var name="tooFast" start="false" per="hmi"/>
  <var name="showBoxes" start="true"/>
  <computed name="speedPercent" get="Speed / 2 * 100" target="Speed" set="v / 100 * 2" unit="%"/>
  <computed name="partsPerMinute" get="Conveyor.speed / 0.4 * 60" unit="/min"/>
  <record name="speedHistory" source="Conveyor.speed" every="100" keep="60"/>
  <on id="h1" name="Count running time" every="1000">
    if (Running) runSeconds = runSeconds + 1;
  </on>
  <on id="h2" name="Too fast" when="Speed > 1.5" for="2000">
    tooFast = true;
    log("the line ran too fast for 2 s");
  </on>
  <on id="h3" name="Back in range" when="Speed <= 1.5">
    tooFast = false;
  </on>
  <on id="h4" name="Stopped" change="Running">
    if (!p.value) log("the line stopped");
  </on>
</object>
