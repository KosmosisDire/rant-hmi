<component name="Plot" size="40x16" sizing="fill">
  <prop name="values" default="[]"/>
  <prop name="min" default="0"/>
  <prop name="max" default="1"/>
  <prop name="seconds" default="10"/>
  <prop name="colour" default="$accent"/>
  <prop name="thickness" default="2"/>
  <prop name="fill" default="$panel"/>
  <prop name="radius" default="$radius"/>
  <div id="e1" name="card" x="0" y="0" w="100%" h="100%" style='background: fill; border-radius: radius; gap: $space; layout: "down"; padding: 1'>
    <svg id="e2" name="chart" x="1" y="1" w="fill" h="fill" viewbox='"0 0 100 100"' fit='"stretch"' style='overflow: "hidden"'>
      <polyline id="e3" name="line" fill='"none"' points='values.length ? values.map((s) => ((s.t - values[values.length - 1].t) / (seconds * 1000) + 1) * 100 + "," + (100 - ((s.v - min) / (max - min)) * 100)).join(" ") : ""' stroke="colour" stroke-linecap='"round"' stroke-linejoin='"round"' stroke-width="thickness" vector-effect='"non-scaling-stroke"'/>
    </svg>
  </div>
</component>
