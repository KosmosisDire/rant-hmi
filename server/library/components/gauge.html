<component name="Gauge" size="16x16">
  <prop name="value" default="0"/>
  <prop name="min" default="0"/>
  <prop name="max" default="100"/>
  <prop name="unit" default='""'/>
  <svg id="e1" name="dial" x="0" y="0" w="16" h="16">
    <circle id="e2" name="track" cx="8" cy="8" fill='"none"' pathlength="100" r="6.4" stroke="#3a4046" stroke-dasharray='"75 100"' stroke-linecap='"round"' stroke-width="1.1" transform='"rotate(135 8 8)"'/>
    <circle id="e3" name="level" cx="8" cy="8" fill='"none"' pathlength="100" r="6.4" stroke='value > max * 0.8 ? "#c62828" : "#4a8fd6"' stroke-dasharray="`${Math.min(Math.max((value - min) / (max - min), 0), 1) * 75} 100`" stroke-linecap='"round"' stroke-width="1.1" transform='"rotate(135 8 8)"'/>
    <text id="e4" name="reading" dominant-baseline='"middle"' fill="#e4e6e8" font-size="2.7" text-anchor='"middle"' x="8" y="8.4">value.toFixed(1)</text>
    <text id="e5" name="units" dominant-baseline='"middle"' fill="#9aa0a6" font-size="1.3" text-anchor='"middle"' x="8" y="11.5">unit</text>
  </svg>
</component>
