<component name="Dropdown" size="20x4" sizing="fill">
  <prop name="value" default='""' bindable="true"/>
  <prop name="options" default='["Auto", "Manual", "Off"]'/>
  <prop name="rows" default="6"/>
  <prop name="fill" default="$panel3"/>
  <prop name="listFill" default="$panel2"/>
  <prop name="pickedFill" default="$accentBg"/>
  <prop name="textColour" default="$text"/>
  <prop name="textSize" default="1.6"/>
  <prop name="radius" default="$radius"/>
  <event name="change"/>
  <var name="open" start="false"/>
  <div id="e1" name="face" x="0" y="0" w="100%" h="100%" style="background: fill; border-radius: radius">
    <on event="tap">
      open = !open;
    </on>
    <on event="outside">
      open = false;
    </on>
    <div id="e2" name="content" x="0" y="0" w="100%" h="100%" style='align: "center left"; gap: $space; layout: "right"; padding: 1.2'>
      <span id="e3" name="label" x="1" y="1" w="fill" h="hug" style="color: textColour; font-size: textSize">value</span>
      <svg id="e4" name="chevron" x="3" y="3" w="2" h="2">
        <polyline id="e5" name="Line" fill='"none"' points='"0.4,0.7 1,1.3 1.6,0.7"' stroke="$dim" stroke-linecap='"round"' stroke-width="0.2" transform="`rotate(${open ? 180 : 0} 1 1)`"/>
      </svg>
    </div>
    <div id="e6" name="list" x="0" y="100%" w="100%" h="hug" style='background: listFill; border-radius: radius; box-shadow: "0 8px 24px #000a"; gap: 0; layout: "down"; margin-top: 0.4; max-height: rows * 3.6 + 0.8; overflow-y: "auto"; padding: 0.4; visibility: open ? "visible" : "hidden"'>
      <div id="e7" name="option" repeat="options" x="1" y="1" w="fill" h="3.6" style='align: "center left"; background: item === value ? pickedFill : "transparent"; border-radius: $radiusSmall; gap: $space; layout: "right"; padding: 0.8'>
        <on event="tap">
          value = item;
          open = false;
          emit("change", item);
        </on>
        <span id="e8" name="optionLabel" x="1" y="1" w="fill" h="hug" style="color: textColour; font-size: textSize">item</span>
      </div>
    </div>
  </div>
</component>
