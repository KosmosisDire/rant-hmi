<component name="Joystick1D" size="24x6">
  <prop name="travel" default="9"/>
  <prop name="repeatMs" default="100"/>
  <event name="move"/>
  <event name="held"/>
  <var name="kx" start="0"/>
  <svg id="e1" name="pad" x="0" y="0" w="24" h="6">
    <rect id="e2" name="track" fill="#1e2125" height="5.4" rx="2.7" stroke="#3a4046" stroke-width="0.2" width="23.4" x="0.3" y="0.3">
      <on event="release">
        kx = 0;
        emit("move", { x: 0 });
        emit("held", { x: 0 });
      </on>
      <on event="repeat" every="repeatMs">
        emit("held", { x: kx });
      </on>
      <on event="drag">
        // the knob goes where the finger is along a track 23.4 across, as far as the travel
        kx = Math.max(-1, Math.min(1, ((p.x - 0.5) * 23.4) / travel));
        emit("move", { x: kx });
      </on>
    </rect>
    <line id="e3" name="span" fill='"none"' pointer-events='"none"' stroke="#2f3540" stroke-dasharray='"0.4 0.6"' stroke-linecap='"round"' stroke-width="0.2" x1="12 - travel" x2="12 + travel" y1="3" y2="3"/>
    <circle id="e4" name="knob" cx="12 + kx * travel" cy="3" fill='track.pressed ? "#4a8fd6" : "#3a4046"' pointer-events='"none"' r="2.2" stroke="#e4e6e8" stroke-width="0.2"/>
  </svg>
</component>
