<component name="Bars" size="36x12" sizing="fill">
  <prop name="values" default="[0.3, 0.7, 0.5]" type="number[]"/>
  <prop name="labels" default="[]"/>
  <prop name="min" default="0"/>
  <prop name="max" default="1"/>
  <prop name="unit" default='""'/>
  <prop name="digits" default="2"/>
  <prop name="colour" default="$accent"/>
  <prop name="trackColour" default="$panel3"/>
  <prop name="labelColour" default="$dim"/>
  <prop name="textColour" default="$text"/>
  <prop name="textSize" default="1.4"/>
  <prop name="fill" default="$panel"/>
  <prop name="radius" default="$radius"/>
  <div id="e1" name="card" x="0" y="0" w="100%" h="100%" style='background: fill; border-radius: radius; gap: 0; layout: "down"; padding: 1.5'>
    <div id="e2" name="row" repeat="values" x="1" y="1" w="fill" h="fill" style='align: "center left"; gap: 1; layout: "right"'>
      <span id="e3" name="label" x="1" y="1" w="8" h="hug" style="color: labelColour; font-size: textSize">labels[index] ?? String(index + 1)</span>
      <Bar id="e4" name="Bar" x="3" y="3" w="fill" h="1" colour="colour" max="max" min="min" trackColour="trackColour" value="item"/>
      <span id="e5" name="reading" x="5" y="5" w="7" h="hug" style='align: "center right"; color: textColour; font-size: textSize'>item.toFixed(digits) + (unit ? " " + unit : "")</span>
    </div>
  </div>
</component>
