<component name="ModeSwitch" size="24x4">
  <prop name="value" default='"Auto"' bindable="true"/>
  <prop name="options" default='["Auto", "Manual"]'/>
  <event name="change"/>
  <div id="e1" name="track" x="0" y="0" w="24" h="4" style="background: $panel; border-radius: 2">
    <div id="e2" name="segment" repeat="options" x="index * 24 / options.length" y="0" w="24 / options.length" h="4" style='background: item === value ? $accent : "transparent"; border-radius: 2'>
      <on event="tap">
        value = item;
        emit("change", item);
      </on>
      <span id="e3" name="segmentLabel" x="0" y="0" w="24 / options.length" h="4" style='color: item === value ? $onFill : $text; font-size: 1.5; line-height: "40px"; text-align: "center"'>item</span>
    </div>
  </div>
</component>
