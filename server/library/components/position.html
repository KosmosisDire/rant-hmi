<component name="Position" size="24x26" sizing="fill">
  <prop name="value" default="{ position: vec(0.3, 0.2), angle: 0.6 }"/>
  <prop name="min" default="vec(-1, -1)"/>
  <prop name="max" default="vec(1, 1)"/>
  <prop name="digits" default="2"/>
  <prop name="colour" default="$accent"/>
  <prop name="gridColour" default="$border2"/>
  <prop name="textColour" default="$text"/>
  <prop name="fill" default="$panel"/>
  <prop name="radius" default="$radius"/>
  <div id="e1" name="card" x="0" y="0" w="100%" h="100%" style='background: fill; border-radius: radius; gap: 0.8; layout: "down"; padding: 1.5'>
    <svg id="e2" name="plane" x="1" y="1" w="fill" h="fill" viewbox="`${min.x} ${-max.y} ${max.x - min.x} ${max.y - min.y}`">
      <rect id="e3" name="area" fill='"none"' height="max.y - min.y" stroke="gridColour" stroke-width="1" vector-effect='"non-scaling-stroke"' width="max.x - min.x" x="min.x" y="-max.y"/>
      <line id="e4" name="xAxis" fill='"none"' stroke="gridColour" stroke-linecap='"round"' stroke-width="1" vector-effect='"non-scaling-stroke"' x1="min.x" x2="max.x" y1="0" y2="0"/>
      <line id="e5" name="yAxis" fill='"none"' stroke="gridColour" stroke-linecap='"round"' stroke-width="1" vector-effect='"non-scaling-stroke"' x1="0" x2="0" y1="-max.y" y2="-min.y"/>
      <g id="e6" name="marker" repeat="Array.isArray(value) ? value : [value]" transform="`translate(${(item.position ?? item).x} ${-(item.position ?? item).y}) rotate(${-degrees(item.angle ?? 0)})`">
        <line id="e7" name="heading" fill='"none"' stroke="colour" stroke-linecap='"round"' stroke-width="2" vector-effect='"non-scaling-stroke"' x1="0" x2="item.angle === undefined ? 0 : (max.x - min.x) * 0.1" y1="0" y2="0"/>
        <circle id="e8" name="dot" cx="0" cy="0" fill="colour" r="(max.x - min.x) * 0.025"/>
      </g>
    </svg>
    <span id="e9" name="reading" x="3" y="3" w="fill" h="hug" style="color: textColour; font-size: 1.3">Array.isArray(value) ? value.length + " points" : "x " + (value.position ?? value).x.toFixed(digits) + ", y " + (value.position ?? value).y.toFixed(digits) + (value.angle === undefined ? "" : ", " + degrees(value.angle).toFixed(0) + "°")</span>
  </div>
</component>
