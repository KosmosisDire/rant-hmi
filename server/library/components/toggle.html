<component name="Toggle" size="8x4">
  <prop name="value" default="false" bindable="true"/>
  <event name="change"/>
  <div id="e1" name="track" x="0" y="0" w="8" h="4" style='background: value ? "#2e7d32" : "#3a4046"; border-radius: 2'>
    <on event="tap">
      value = !value;
      emit("change", value);
    </on>
    <div id="e2" name="knob" x="value ? 4.4 : 0.4" y="0.4" w="3.2" h="3.2" style='background: #e4e6e8; border-radius: 1.6; box-shadow: "0 1px 3px #0006"; transition: "left 120ms ease-out"'/>
  </div>
</component>
