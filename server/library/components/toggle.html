<component name="Toggle" size="88x44">
  <prop name="value" default="false" bindable="true"/>
  <event name="change"/>
  <div id="e1" name="track" x="0" y="0" w="88" h="44" style='background: value ? "#2e7d32" : "#3a4046"; border-radius: 22'>
    <on event="tap">
      value = !value;
      emit("change", value);
    </on>
    <div id="e2" name="knob" x="value ? 48 : 4" y="4" w="36" h="36" style='background: #e4e6e8; border-radius: 18; box-shadow: "0 1px 3px #0006"; transition: "left 120ms ease-out"'/>
  </div>
</component>
