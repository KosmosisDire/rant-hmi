<component name="Toggle" size="8x4" sizing="fill">
  <prop name="value" default="false" type="bool" bindable="true"/>
  <prop name="colour" default="$accent"/>
  <prop name="trackColour" default="$panel3"/>
  <prop name="knobColour" default="$text"/>
  <event name="change"/>
  <div id="e1" name="track" x="0" y="0" w="100%" h="100%" style="background: value ? colour : trackColour; border-radius: $radiusPill">
    <on event="tap">
      value = !value;
      emit("change", value);
    </on>
    <div id="e2" name="knob" x="(value ? 100 : 0)%" y="0" w="hug" h="100%" origin='value ? "100% 0%" : "0% 0%"' style='aspect-ratio: 1; background: knobColour; background-clip: "padding-box"; border-color: "transparent"; border-radius: "50%"; border-style: "solid"; border-width: 0.4; filter: "drop-shadow(0 1px 2px #0006)"; transition: "left 120ms ease-out, translate 120ms ease-out"'/>
  </div>
</component>
