<component name="Readout" size="20x8">
  <prop name="label" default='"Value"'/>
  <prop name="value" default="0"/>
  <prop name="unit" default='""'/>
  <prop name="digits" default="1"/>
  <div id="e1" name="card" x="0" y="0" w="20" h="8" style="background: $panel; border-radius: $radius">
    <span id="e2" name="caption" x="1.5" y="0.9" w="17.1" h="2" style="color: $dim; font-size: 1.3">label</span>
    <span id="e3" name="reading" x="1.5" y="3.1" w="17.1" h="4" style="color: $text; font-size: 2.5; font-weight: 600">value.toFixed(digits) + " " + unit</span>
  </div>
</component>
