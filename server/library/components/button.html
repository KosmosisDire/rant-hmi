<component name="Button" size="20x6">
  <prop name="text" default='"Start"'/>
  <prop name="holdMs" default="0"/>
  <event name="confirm"/>
  <div id="e1" name="face" x="0" y="0" w="20" h="6" style="background: root.pressed ? $panel2 : $panel3; border-radius: $radius">
    <on event="tap">
      if (!holdMs) emit("confirm");
    </on>
    <on event="hold" after="holdMs || 1e9">
      if (holdMs) emit("confirm");
    </on>
    <span id="e2" name="label" x="0" y="0" w="20" h="6" style='color: $text; font-size: 2; font-weight: 600; line-height: "60px"; text-align: "center"'>text</span>
    <div id="e3" name="bar" x="0" y="5.5" w="holdMs ? 20 * Math.min(root.heldFor / holdMs, 1) : 0" h="0.5" style="background: $accent; border-radius: 0.8"/>
  </div>
</component>
