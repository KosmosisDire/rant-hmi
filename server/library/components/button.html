<component name="Button" size="220x66">
  <prop name="text" default='"Start"'/>
  <prop name="holdMs" default="0"/>
  <event name="confirm"/>
  <div id="e1" name="face" x="0" y="0" w="220" h="66" style='background: root.pressed ? "#1f5a24" : "#2e7d32"; border-radius: 8'>
    <on event="tap">
      if (!holdMs) emit("confirm");
    </on>
    <on event="hold" after="holdMs || 1e9">
      if (holdMs) emit("confirm");
    </on>
    <span id="e2" name="label" x="0" y="0" w="220" h="66" style='color: #ffffff; font-size: 22; font-weight: 600; line-height: "66px"; text-align: "center"'>text</span>
    <div id="e3" name="bar" x="0" y="60" w="holdMs ? 220 * Math.min(root.heldFor / holdMs, 1) : 0" h="6" style="background: #ffffffaa; border-radius: 8"/>
  </div>
</component>
