[package]
name = "rant-hmi"
version = "0.0.1"
edition = "2024"
description = "The Rant HMI backend: one Rant node on the system that serves the editor and every screen"
publish = false

[[bin]]
name = "rant-hmi"
path = "src/main.rs"

[dependencies]
rant = { package = "rant-middleware", git = "https://github.com/KosmosisDire/Rant.git", tag = "crate-v0.0.32" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
notify = "8"
rquickjs = "=0.14.0"
serde = { version = "1", features = ["derive"] }
# pure Rust crypto, so no OpenSSL to find on Windows or a target
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
# 1.54.0 races resetting an interval's timer against the driver firing it (tokio PR 8458)
tokio = { version = ">=1.51, <1.54", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "10"

[dev-dependencies]
# tests write values as JSON literals, which the value! macro makes ours
serde_json = { version = "1", features = ["preserve_order"] }
# the demo line's MJPEG camera
jpeg-encoder = "0.6"
