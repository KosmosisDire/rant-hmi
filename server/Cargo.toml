[package]
name = "rant-hmi"
version = "0.0.1"
edition = "2024"
description = "The Rant HMI backend: one Rant node on the system that serves the editor and every screen"
publish = false

[[bin]]
name = "rant-hmi"
path = "src/main.rs"

[dependencies]
rant = { package = "rant-middleware", git = "https://github.com/KosmosisDire/Rant.git", tag = "crate-v0.0.33" }
anyhow = "1"
# the certificate's fingerprint, as an app built here trusts it
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
# a video frame's bytes go to a screen as one CBOR byte string
bytes = { version = "1", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.3"
if-addrs = "0.15"
notify = "8"
rant-hmi-pack = { path = "../app/pack" }
# the HMI's own certificate for https, on the aws-lc-rs WebRTC already builds
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rquickjs = "=0.14.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# pure Rust crypto, so no OpenSSL to find on Windows or a target
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
# 1.54.0 races resetting an interval's timer against the driver firing it (tokio PR 8458)
tokio = { version = ">=1.51, <1.54", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "10"
x509-cert = { version = "0.2", default-features = false }

[dev-dependencies]
# the link's tests call its routes as the app's window does
tower = { version = "0.5", features = ["util"] }
# tests write values as JSON literals, which the value! macro makes ours
serde_json = { version = "1", features = ["preserve_order"] }
# the demo line's MJPEG camera
jpeg-encoder = "0.6"
