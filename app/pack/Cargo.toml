[package]
name = "rant-hmi-pack"
version = "0.0.1"
edition = "2024"
description = "The file a built Rant HMI app is: a launcher, then its runtime, its project and its settings"
publish = false

[[bin]]
name = "rant-hmi-pack"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
