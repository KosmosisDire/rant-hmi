[package]
name = "rant-hmi-addon"
version = "0.0.1"
edition = "2024"
description = "The Rant HMI backend as a Node addon, which rant-hmi-app's window runs in its own process"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rant-hmi = { path = "../../server" }
axum = "0.8"
napi = { version = "3", features = ["async"] }
napi-derive = "3"
tokio = { version = ">=1.51, <1.54", features = ["rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
napi-build = "2"
