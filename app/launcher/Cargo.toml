[package]
name = "rant-hmi-launcher"
version = "0.0.1"
edition = "2024"
description = "What a built Rant HMI app starts as: it unpacks what it carries and runs the window on it"
publish = false

[[bin]]
name = "rant-hmi-app"
path = "src/main.rs"

[dependencies]
rant-hmi-pack = { path = "../pack" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
