<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- the panel owns its scale: no browser zoom, no safe-area letterbox, and the on-screen
         keyboard resizes the layout instead of scrolling the page out from under it -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- no auto-linking a readout that happens to look like a phone number or a date -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <!-- launched from the home screen it runs without browser chrome, so there is no
         address bar gesture to fight -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <title>HMI Designer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" data-mode="edit"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
